[[commands]]
id = "weather"
type = "lua"
description = "Показать температуру в градусах Цельсия"
script = "script.lua"
timeout = 5000
sandbox = "standard"

[commands.phrases]
ru = ["какая погода", "погода", "какая погода в {city}", "погода в {city}"]
en = ["what's the weather", "weather", "what's the weather in {city}", "weather in {city}"]

[commands.sounds]
ru = ["weather_ru_1", "weather_ru_2"]
en = ["weather_en_1", "weather_en_2"]

[commands.slots.city]
entity = "city name"
context = ["in", "for", "at", "в", "для"]


[[commands]]
id = "set_city"
type = "lua"
description = "Сохранить город для команды погоды"
script = "set_city.lua"
sandbox = "standard"
timeout = 5000

[commands.phrases]
ru = ["установи город {city}", "измени город на {city}", "город {city}"]
en = ["set city {city}", "change city to {city}"]

[commands.sounds]
ru = ["ok1", "ok2", "ok3"]
en = ["ok1", "ok2", "ok3"]

[commands.slots.city]
entity = "city name"
context = ["город", "на", "в", "city", "to", "in"]
