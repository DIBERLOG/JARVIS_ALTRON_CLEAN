[[commands]]
id = "windows_minimize_all"
type = "cli"
description = "Свернуть все окна и показать рабочий стол"
cli_cmd = "powershell.exe"
cli_args = ["-NoProfile", "-NonInteractive", "-WindowStyle", "Hidden", "-ExecutionPolicy", "Bypass", "-File", "{command_dir}/windows.ps1", "-Action", "Minimize"]
sounds.ru = ["ok1", "ok2", "ok3"]
phrases.ru = ["сверни все окна", "свернуть все окна", "сверни окна", "покажи рабочий стол", "убери все окна", "сверни всё"]
phrases.en = ["minimize all windows", "show desktop"]

[[commands]]
id = "windows_restore_all"
type = "cli"
description = "Восстановить окна после сворачивания"
cli_cmd = "powershell.exe"
cli_args = ["-NoProfile", "-NonInteractive", "-WindowStyle", "Hidden", "-ExecutionPolicy", "Bypass", "-File", "{command_dir}/windows.ps1", "-Action", "Restore"]
sounds.ru = ["ok1", "ok2", "ok3"]
phrases.ru = ["верни окна", "верни все окна", "верни окна обратно", "восстанови окна", "восстанови все окна", "разверни окна", "разверни все окна", "разверни окна обратно", "разверни все окна обратно", "отмени сворачивание", "отмени сворачивание окон"]
phrases.en = ["restore windows", "undo minimize"]
